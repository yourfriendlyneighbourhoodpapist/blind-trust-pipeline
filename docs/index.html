<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="description" content="Blind Trust — a mobile tracker for Canada's CIEC public registry of conflict-of-interest disclosures. Public data, not investment advice.">
<title>Blind Trust — CIEC registry tracker</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{background:#0a1810;background-image:radial-gradient(140% 100% at 50% 0,#173321 0%,#0c1c12 46%,#050d08 100%);background-attachment:fixed;color:#FDFFFC;font-family:'General Sans','Neue Montreal',system-ui,-apple-system,sans-serif;font-feature-settings:'tnum' 1;-webkit-font-smoothing:antialiased}
a{color:#B4D163;text-decoration:none}a:hover{color:#c7de84}
input{font-family:inherit}
button{font-family:inherit}
::placeholder{color:#8C99A4}
@keyframes riseIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(102%)}to{transform:none}}
@keyframes modalPop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes dropIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes drawLine{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-delay:0ms!important;transition-duration:.001ms!important}}
html,body{min-height:100%}
#app{min-height:100vh}
</style>
</head>
<body>
<div id="app"></div>

<template id="tpl">
<div style="position:relative;min-height:100vh;overflow-x:hidden">

  <div style="position:relative;z-index:1;max-width:720px;margin:0 auto;padding:0 16px 132px">

    <!-- TOP BAR -->
    <div style="position:sticky;top:0;z-index:20;margin:0 -16px;padding:12px 16px 11px;background:rgba(0,20,0,.9);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)">
      <div style="display:flex;align-items:center;gap:11px">
        <svg width="36" height="36" viewBox="0 0 64 64" style="flex:none">
          <defs><clipPath id="bt-leaf"><path d="M32 61 L30 49 L18 53 L22 42 L8 40 L18 32 L6 24 L20 22 L16 10 L28 16 L32 3 L36 16 L48 10 L44 22 L58 24 L46 32 L56 40 L42 42 L46 53 L34 49 Z"></path></clipPath></defs>
          <path d="M32 61 L30 49 L18 53 L22 42 L8 40 L18 32 L6 24 L20 22 L16 10 L28 16 L32 3 L36 16 L48 10 L44 22 L58 24 L46 32 L56 40 L42 42 L46 53 L34 49 Z" fill="rgba(0,20,0,.5)" stroke="#B4D163" stroke-width="2" stroke-linejoin="round"></path>
          <g clip-path="url(#bt-leaf)">
            <line x1="21" y1="30" x2="21" y2="44" stroke="rgba(253,255,252,.45)" stroke-width="1.5"></line>
            <rect x="18.5" y="35" width="5" height="6" rx="1" fill="rgba(253,255,252,.4)"></rect>
            <line x1="33" y1="26" x2="33" y2="40" stroke="rgba(253,255,252,.45)" stroke-width="1.5"></line>
            <rect x="30.5" y="30" width="5" height="6" rx="1" fill="rgba(253,255,252,.4)"></rect>
            <line x1="45" y1="18" x2="45" y2="32" stroke="rgba(253,255,252,.45)" stroke-width="1.5"></line>
            <rect x="42.5" y="21" width="5" height="6" rx="1" fill="rgba(253,255,252,.4)"></rect>
            <polyline points="14,45 24,39 33,41 43,27 53,18" fill="none" stroke="#B4D163" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="stroke-dasharray:130;stroke-dashoffset:130;animation:drawLine 1.1s ease .25s forwards"></polyline>
          </g>
        </svg>
        <div style="line-height:1.05">
          <div style="font-size:18px;font-weight:600;letter-spacing:-.03em">Blind Trust</div>
          <div style="font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#8C99A4;margin-top:2px">CIEC registry tracker</div>
        </div>
        <div style="flex:1"></div>
        <button onClick="{{ toggleNotif }}" style="all:unset;cursor:pointer;position:relative;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(0,20,0,.5);box-shadow:inset 0 1px 0 rgba(253,255,252,.1)">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FDFFFC" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path></svg>
          <sc-if value="{{ hasNotif }}"><span style="position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#B4D163;color:#001400;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ notifCount }}</span></sc-if>
        </button>
      </div>
      <div style="display:flex;gap:9px;margin-top:11px">
        <div style="flex:1;display:flex;align-items:center;gap:9px;padding:0 13px;height:42px;border-radius:13px;background:rgba(253,255,252,.07);box-shadow:inset 0 1px 0 rgba(253,255,252,.1)">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8C99A4" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
          <input value="{{ q }}" onInput="{{ onSearch }}" placeholder="Search names, companies, filings…" style="flex:1;min-width:0;border:none;outline:none;background:transparent;color:#FDFFFC;font-size:14px" />
        </div>
        <button onClick="{{ toggleFilters }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:0 15px;height:42px;border-radius:13px;background:rgba(253,255,252,.07);box-shadow:inset 0 1px 0 rgba(253,255,252,.1);font-size:13px;font-weight:600">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FDFFFC" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="7" y1="12" x2="17" y2="12"></line><line x1="10" y1="17" x2="14" y2="17"></line></svg>
          Filters
          <sc-if value="{{ hasActive }}"><span style="min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#B4D163;color:#001400;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center">{{ activeCount }}</span></sc-if>
        </button>
      </div>
    </div>

    <!-- QUICK CHIPS -->
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:13px 0 2px">
      <button onClick="{{ pmChip.onClick }}" style="all:unset;cursor:pointer;padding:7px 13px;border-radius:11px;font-size:12.5px;font-weight:600;background:{{ pmChip.bg }};color:{{ pmChip.fg }};box-shadow:inset 0 1px 0 rgba(253,255,252,.08)">Prime Minister only</button>
      <button onClick="{{ secChip.onClick }}" style="all:unset;cursor:pointer;padding:7px 13px;border-radius:11px;font-size:12.5px;font-weight:600;background:{{ secChip.bg }};color:{{ secChip.fg }};box-shadow:inset 0 1px 0 rgba(253,255,252,.08)">Securities filings only</button>
      <sc-if value="{{ showClear }}"><button onClick="{{ clearFilters }}" style="all:unset;cursor:pointer;padding:7px 13px;border-radius:11px;font-size:12.5px;font-weight:600;background:rgba(89,101,111,.28);color:#FDFFFC">Clear filters ✕</button></sc-if>
      <div style="flex:1"></div>
      <span style="font-size:11px;font-weight:500;color:#8C99A4;white-space:nowrap">{{ dateNote }}</span>
    </div>

    <!-- VIEW: TAPE -->
    <sc-if value="{{ isTape }}">
    <div style="animation:riseIn .45s ease both">
      <h2 style="font-size:23px;font-weight:600;letter-spacing:-.03em;margin:24px 0 2px">Most widely disclosed</h2>
      <div style="font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#9fb08e;margin-bottom:13px">tile size = № of disclosures · not $</div>
      <div style="position:relative;width:100%;height:{{ treeH }}px">
        <sc-for list="{{ mosaic }}" as="t" hint-placeholder-count="8">
          <div style="position:absolute;left:{{ t.x }}%;top:{{ t.y }}px;width:{{ t.w }}%;height:{{ t.h }}px;padding:3px">
            <div style="width:100%;height:100%;border-radius:14px;padding:9px 11px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;background:{{ t.bg }};box-shadow:inset 0 1px 0 rgba(253,255,252,.1),0 12px 30px rgba(0,20,0,.34)">
              <div style="position:absolute;top:8px;right:8px;width:20px;height:20px"><dc-import name="CompanyLogo" domain="{{ t.domain }}" ticker="{{ t.ticker }}" mono="{{ t.mono }}" hint-size="20px,20px"></dc-import></div>
              <div style="min-width:0">
                <div style="font-size:16px;font-weight:600;letter-spacing:-.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:22px">{{ t.ticker }}</div>
                <sc-if value="{{ t.showName }}"><div style="font-size:11px;color:#c9c7bd;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ t.name }}</div></sc-if>
              </div>
              <sc-if value="{{ t.showMeta }}"><div style="font-size:10.5px;font-weight:500;color:#8C99A4">{{ t.meta }}</div></sc-if>
            </div>
          </div>
        </sc-for>
      </div>

      <h2 style="font-size:23px;font-weight:600;letter-spacing:-.03em;margin:28px 0 12px">Disclosure tape</h2>
      <div style="border-radius:20px;overflow:hidden;background:linear-gradient(155deg,rgba(253,255,252,.16),rgba(253,255,252,.08));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:inset 0 1px 0 rgba(253,255,252,.14),0 24px 60px rgba(0,20,0,.45)">
        <div style="display:grid;grid-template-columns:1.35fr 1.2fr .9fr auto;gap:8px;padding:11px 13px;background:rgba(0,20,0,.5);font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#8C99A4">
          <span>Stock</span><span>Politician</span><span>Event</span><span style="text-align:right">Since*</span>
        </div>
        <sc-for list="{{ tape }}" as="r" hint-placeholder-count="8">
          <div style="display:grid;grid-template-columns:1.35fr 1.2fr .9fr auto;gap:8px;align-items:center;padding:10px 13px;background:{{ r.zebra }}">
            <div style="display:flex;align-items:center;gap:9px;min-width:0">
              <div style="width:34px;height:34px;flex:none"><dc-import name="CompanyLogo" domain="{{ r.company.domain }}" ticker="{{ r.company.ticker }}" mono="{{ r.company.mono }}" hint-size="34px,34px"></dc-import></div>
              <div style="min-width:0">
                <div style="font-size:13px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:center;gap:5px"><span>{{ r.company.ticker }}</span><sc-if value="{{ r.sp }}"><span style="font-size:9px;font-weight:700;color:#8C99A4;background:rgba(89,101,111,.25);padding:1px 4px;border-radius:5px">sp</span></sc-if></div>
                <div style="font-size:11px;color:#8C99A4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.company.name }}</div>
              </div>
            </div>
            <div style="display:flex;align-items:center;gap:8px;min-width:0">
              <div style="width:30px;height:30px;flex:none"><dc-import name="Avatar" initials="{{ r.personInitials }}" ring="{{ r.personRing }}" photo="{{ r.personPhoto }}" fs="11" hint-size="30px,30px"></dc-import></div>
              <div style="min-width:0">
                <div onClick="{{ r.open }}" style="cursor:pointer;font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.personName }}</div>
                <div style="font-size:10.5px;color:#8C99A4">{{ r.roleLine }}</div>
              </div>
            </div>
            <div>
              <div style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;flex:none;background:{{ r.event.dot }}"></span><span style="font-size:12px;font-weight:500">{{ r.event.label }}</span></div>
              <div style="font-size:10.5px;color:#8C99A4;margin-top:2px">{{ r.event.date }}</div>
            </div>
            <div style="text-align:right"><span style="font-size:12.5px;font-weight:600;white-space:nowrap;color:{{ r.perf.c }}">{{ r.perf.t }}</span></div>
          </div>
        </sc-for>
      </div>
      <sc-if value="{{ tapeHasMore }}"><button onClick="{{ loadMoreTape }}" style="all:unset;cursor:pointer;display:block;box-sizing:border-box;width:100%;margin-top:12px;padding:12px;border-radius:14px;text-align:center;font-size:13px;font-weight:600;color:#B4D163;background:rgba(180,209,99,.14);box-shadow:inset 0 0 0 1px rgba(180,209,99,.28)">Load {{ tapeMoreCount }} more</button></sc-if>
      <p style="font-size:11.5px;line-height:1.5;color:#8C99A4;margin:14px 2px 0">{{ footTape }}</p>
    </div>
    </sc-if>

    <!-- VIEW: HOLDINGS -->
    <sc-if value="{{ isHoldings }}">
    <div style="animation:riseIn .45s ease both;margin-top:22px">
      <sc-for list="{{ holdings }}" as="c" hint-placeholder-count="4">
        <div style="margin-bottom:15px;border-radius:20px;padding:17px 17px 15px;background:linear-gradient(155deg,rgba(253,255,252,.17),rgba(253,255,252,.09));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:inset 0 1px 0 rgba(253,255,252,.14),0 24px 60px rgba(0,20,0,.45),0 0 0 {{ c.ringW }}px rgba(180,209,99,{{ c.ring }})">
          <div style="display:flex;align-items:center;gap:11px">
            <div style="width:44px;height:44px;flex:none"><dc-import name="Avatar" initials="{{ c.person.initials }}" ring="{{ c.person.ring }}" photo="{{ c.person.photo }}" fs="15" hint-size="44px,44px"></dc-import></div>
            <div style="flex:1;min-width:0">
              <div onClick="{{ c.person.open }}" style="cursor:pointer;font-size:16px;font-weight:600;letter-spacing:-.02em">{{ c.person.name }}</div>
              <div style="font-size:11px;color:#8C99A4">{{ c.person.roleLine }}</div>
            </div>
            <sc-if value="{{ c.hasSig }}"><span style="padding:5px 10px;border-radius:10px;background:rgba(180,209,99,.18);color:#B4D163;font-size:11px;font-weight:600;white-space:nowrap">◆ {{ c.signals }} signals</span></sc-if>
          </div>

          <sc-if value="{{ c.pmNote }}"><div style="margin-top:12px;padding:11px 13px;border-radius:13px;background:rgba(0,20,0,.4);font-size:12px;line-height:1.5;color:#c9c7bd">{{ c.pmNote }}</div></sc-if>

          <sc-if value="{{ c.hasSec }}">
            <div style="font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#8C99A4;margin:14px 0 7px">Disclosed securities</div>
            <sc-for list="{{ c.securities }}" as="s" hint-placeholder-count="4">
              <div style="display:flex;align-items:center;gap:9px;padding:7px 0;background:{{ s.zebra }}">
                <div style="width:28px;height:28px;flex:none"><dc-import name="CompanyLogo" domain="{{ s.domain }}" ticker="{{ s.ticker }}" mono="{{ s.mono }}" hint-size="28px,28px"></dc-import></div>
                <div style="flex:1;min-width:0"><div style="font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ s.name }}</div><div style="font-size:10.5px;color:#8C99A4">{{ s.ticker }}</div></div>
                <div style="display:flex;align-items:center;gap:6px"><sc-if value="{{ s.sp }}"><span style="font-size:9px;font-weight:700;color:#8C99A4;background:rgba(89,101,111,.25);padding:1px 4px;border-radius:5px">sp</span></sc-if><span style="font-size:12.5px;font-weight:600;color:{{ s.perfColor }};white-space:nowrap">{{ s.perfText }}</span></div>
              </div>
            </sc-for>
          </sc-if>

          <sc-if value="{{ c.hasMaterial }}">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px">
              <div>
                <div style="font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#B4D163;margin-bottom:7px">▲ Newly disclosed</div>
                <sc-for list="{{ c.material.added }}" as="m" hint-placeholder-count="3"><div style="padding:4px 0"><div style="font-size:12px;font-weight:500">{{ m.name }}</div><div style="font-size:10px;color:#8C99A4">{{ m.ticker }} · {{ m.date }}</div></div></sc-for>
                <sc-if value="{{ c.material.noneAdded }}"><div style="font-size:11.5px;color:#8C99A4">—</div></sc-if>
              </div>
              <div>
                <div style="font-size:10px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#8C99A4;margin-bottom:7px">▼ No longer disclosed</div>
                <sc-for list="{{ c.material.removed }}" as="m" hint-placeholder-count="3"><div style="padding:4px 0"><div style="font-size:12px;font-weight:500;color:#c9c7bd">{{ m.name }}</div><div style="font-size:10px;color:#8C99A4">{{ m.ticker }} · {{ m.date }}</div></div></sc-for>
              </div>
            </div>
            <p style="font-size:11px;line-height:1.5;color:#8C99A4;margin:11px 0 0">{{ footNoLonger }}</p>
          </sc-if>

          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:14px">
            <sc-for list="{{ c.tags }}" as="tg" hint-placeholder-count="2"><span style="padding:4px 9px;border-radius:9px;background:rgba(0,20,0,.4);font-size:10.5px;font-weight:500;color:#c9c7bd">{{ tg }}</span></sc-for>
          </div>
        </div>
      </sc-for>
      <sc-if value="{{ holdingsEmpty }}"><div style="text-align:center;color:#8C99A4;font-size:13px;padding:40px 0">No filers match these filters.</div></sc-if>
    </div>
    </sc-if>

    <!-- VIEW: SIGNALS -->
    <sc-if value="{{ isSignals }}">
    <div style="animation:riseIn .45s ease both;margin-top:22px">
      <p style="font-size:13px;line-height:1.55;color:#c9c7bd;margin:0 2px 16px">{{ signalsIntro }}</p>
      <sc-for list="{{ signals }}" as="s" hint-placeholder-count="4">
        <div style="margin-bottom:15px;border-radius:20px;padding:17px;background:linear-gradient(155deg,rgba(253,255,252,.17),rgba(253,255,252,.09));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:inset 0 1px 0 rgba(253,255,252,.14),0 24px 60px rgba(0,20,0,.45)">
          <div style="display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:#8C99A4"><span>{{ s.source }}</span><span>·</span><span>{{ s.date }}</span></div>
          <div style="font-size:16px;font-weight:600;letter-spacing:-.02em;line-height:1.32;margin:8px 0 10px;text-wrap:pretty">{{ s.title }}</div>
          <span style="padding:4px 9px;border-radius:9px;background:rgba(180,209,99,.16);color:#B4D163;font-size:10.5px;font-weight:600">{{ s.sector }}</span>
          <div style="display:flex;flex-wrap:wrap;gap:7px;margin-top:12px">
            <sc-for list="{{ s.companies }}" as="co" hint-placeholder-count="3"><div style="display:flex;align-items:center;gap:6px;padding:5px 9px 5px 5px;border-radius:11px;background:rgba(0,20,0,.42)"><div style="width:22px;height:22px;flex:none"><dc-import name="CompanyLogo" domain="{{ co.domain }}" ticker="{{ co.ticker }}" mono="{{ co.mono }}" hint-size="22px,22px"></dc-import></div><span style="font-size:12px;font-weight:600">{{ co.ticker }}</span></div></sc-for>
          </div>
          <div style="font-size:10px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#8C99A4;margin:15px 0 8px">Disclosed holders</div>
          <sc-for list="{{ s.holders }}" as="h" hint-placeholder-count="2">
            <div style="display:flex;align-items:center;gap:10px;padding:6px 0">
              <div style="width:32px;height:32px;flex:none"><dc-import name="Avatar" initials="{{ h.initials }}" ring="{{ h.ring }}" photo="{{ h.photo }}" fs="12" hint-size="32px,32px"></dc-import></div>
              <div style="flex:1;min-width:0"><div onClick="{{ h.open }}" style="cursor:pointer;font-size:13px;font-weight:600;letter-spacing:-.01em">{{ h.name }} <sc-if value="{{ h.sp }}"><span style="font-size:9px;font-weight:700;color:#8C99A4;background:rgba(89,101,111,.25);padding:1px 4px;border-radius:5px">sp</span></sc-if></div><div style="font-size:11px;color:#8C99A4">disclosed {{ h.date }}</div></div>
              <span style="font-size:12px;font-weight:600;color:#B4D163;white-space:nowrap">{{ h.tickers }}</span>
            </div>
          </sc-for>
          <sc-if value="{{ s.note }}"><div style="margin-top:10px;padding:9px 11px;border-radius:11px;background:rgba(0,20,0,.4);font-size:11.5px;line-height:1.5;color:#8C99A4">{{ s.note }}</div></sc-if>
        </div>
      </sc-for>
    </div>
    </sc-if>

    <!-- VIEW: ALPHA -->
    <sc-if value="{{ isAlpha }}">
    <div style="animation:riseIn .45s ease both;margin-top:22px">
      <p style="font-size:13px;line-height:1.55;color:#c9c7bd;margin:0 2px 16px">{{ alphaIntro }}</p>

      <div style="margin-bottom:15px;border-radius:20px;padding:17px;background:linear-gradient(155deg,rgba(253,255,252,.17),rgba(253,255,252,.09));backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:inset 0 1px 0 rgba(253,255,252,.14),0 24px 60px rgba(0,20,0,.45)">
        <div style="font-size:16px;font-weight:600;letter-spacing:-.02em">Government Favour Index</div>
        <div style="font-size:11px;color:#8C99A4;margin:2px 0 14px">Composite of announcements · contracts · lobbying · insider trades</div>
        <sc-for list="{{ gfi }}" as="g" hint-placeholder-count="6">
          <div style="padding:7px 0">

    <!-- VIEW: FILINGS -->

      <sc-if value="{{ filingsEmpty }}"><div style="text-align:center;color:#8C99A4;font-size:13px;padding:40px 0">No filings match these filters.</div></sc-if>

    <!-- FOOTER -->
    <p style="font-size:10.5px;line-height:1.6;color:#8a9a7c;margin:26px 2px 0;text-wrap:pretty">{{ footer }}</p>

      <button onClick="{{ nav.filings.go }}" style="all:unset;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 13px;border-radius:15px;transition:background .25s,color .25s;background:{{ nav.filings.bg }};color:{{ nav.filings.fg }}"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"></rect><line x1="8" y1="8" x2="16" y2="8"></line><line x1="8" y1="12" x2="16" y2="12"></line><line x1="8" y1="16" x2="13" y2="16"></line></svg><span style="font-size:10px;font-weight:600;letter-spacing:.01em">Filings</span></button>

<script>
/* ------------------------------------------------------------------ *
 * Blind Trust — self-contained runtime.
 *
 * The source of this page is a Claude Design comp (Blind Trust.dc.html)
 * that targets the Design runtime: {{ }} bindings, <sc-if>/<sc-for>
 * control flow, and <dc-import> components (CompanyLogo, Avatar). This
 * file reimplements just enough of that runtime — a tiny template
 * interpreter, the two imported components, and a DCLogic base class —
 * so the comp runs as a plain, dependency-free web app. The component
 * logic below (class Component extends DCLogic) is the comp's own code,
 * unchanged: it fetches this repo's live pipeline JSON and falls back to
 * baked sample data.
 * ------------------------------------------------------------------ */
(function () {
  'use strict';

  /* ---- expression + binding helpers ---- */

  // Resolve a dotted path ("r.company.ticker") against a scope. Scopes are
  // chained with Object.create, so a plain property read walks to outer
  // loop variables and the root binding object automatically.
  function resolve(expr, scope) {
    var parts = String(expr).trim().split('.');
    var v = scope;
    for (var i = 0; i < parts.length; i++) {
      if (v == null) return undefined;
      v = v[parts[i]];
    }
    return v;
  }

  var TOKEN = /\{\{\s*([^}]+?)\s*\}\}/g;

  // Replace every {{ token }} in a string with its resolved value.
  function subst(str, scope) {
    return String(str).replace(TOKEN, function (_, e) {

    });

  // A string that is exactly one {{ token }} -> return the raw value
  // (used for handler attributes, which resolve to functions).
  function soleToken(str) {
    var m = /^\{\{\s*([^}]+?)\s*\}\}$/.exec(String(str).trim());

  }

  var HANDLERS = { onclick: 'click', oninput: 'input', onchange: 'change', onsubmit: 'submit' };
  var SKIP_ATTR = { 'hint-placeholder-count': 1, 'hint-size': 1 };

  /* ---- imported components ---- */

  var TILE_BG = ['#2c3a1d', '#33302a', '#22303f', '#392b2b', '#2a3630', '#38331f', '#28323a', '#2f2a38'];
  function hashStr(s) {
    var h = 0;
    s = s || '';
    for (var i = 0; i < s.length; i++) { h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return h;
  }

  // CompanyLogo: a rounded tile with a monogram, overlaid by the company's
  // real logo (Clearbit) once/if it loads. Fills its fixed-size parent.
  function logoEl(domain, ticker, mono, size) {
    var wrap = document.createElement('div');
    var radius = Math.max(5, Math.round(size * 0.28));
    wrap.setAttribute('style',
      'position:relative;width:100%;height:100%;border-radius:' + radius +
      'px;overflow:hidden;display:flex;align-items:center;justify-content:center;' +
      'background:' + TILE_BG[hashStr(ticker || mono || domain) % TILE_BG.length] +
      ';box-shadow:inset 0 1px 0 rgba(253,255,252,.12),inset 0 0 0 1px rgba(0,20,0,.25)');
    var glyph = document.createElement('span');
    glyph.textContent = mono || '?';
    glyph.setAttribute('style',
      'font-weight:700;letter-spacing:-.02em;color:#e9ede0;font-size:' +
      Math.max(9, Math.round(size * 0.4)) + 'px;line-height:1');
    wrap.appendChild(glyph);
    if (domain) {
      var img = document.createElement('img');
      img.alt = '';
      img.setAttribute('loading', 'lazy');
      img.setAttribute('style',
        'position:absolute;inset:0;width:100%;height:100%;object-fit:contain;' +
        'background:#fff;padding:' + Math.max(1, Math.round(size * 0.13)) +
        'px;opacity:0;transition:opacity .2s ease');
      img.onload = function () { img.style.opacity = '1'; };
      img.onerror = function () { if (img.parentNode) img.parentNode.removeChild(img); };

      wrap.appendChild(img);
    }
    return wrap;
  }

  // Avatar: initials on a dark disc with a party-coloured ring. When a headshot
  // URL is supplied it overlays the disc (object-fit cover) and falls back to
  // the initials if the image is missing or fails to load.
  function avatarEl(initials, ring, fs, photo) {
    var el = document.createElement('div');
    el.setAttribute('style',
      'position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;' +
      'display:flex;align-items:center;justify-content:center;' +
      'background:linear-gradient(160deg,#12240f,#0a1408);' +
      'color:#FDFFFC;font-weight:600;letter-spacing:.01em;font-size:' + (fs || 12) +
      'px;box-shadow:0 0 0 2px ' + (ring || '#8C99A4') +
      ',inset 0 0 0 1px rgba(253,255,252,.08)');
    el.textContent = initials || '?';
    if (photo) {
      var img = document.createElement('img');
      img.alt = '';
      img.setAttribute('loading', 'lazy');
      img.setAttribute('style',
        'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;' +
        'border-radius:50%;opacity:0;transition:opacity .2s ease');
      img.onload = function () { img.style.opacity = '1'; };
      img.onerror = function () { if (img.parentNode) img.parentNode.removeChild(img); };
      img.src = photo;
      el.appendChild(img);
    }
    return el;
  }

  function buildImport(node, scope) {
    var name = node.getAttribute('name');
    var size = parseFloat((node.getAttribute('hint-size') || '32px').split(',')[0]) || 32;
    var a = function (n) { var r = node.getAttribute(n); return r == null ? '' : subst(r, scope); };
    if (name === 'Avatar') {
      return avatarEl(a('initials'), a('ring'), parseFloat(a('fs')) || Math.round(size * 0.38), a('photo'));
    }
    // CompanyLogo
    return logoEl(a('domain'), a('ticker'), a('mono'), size);
  }

  /* ---- the interpreter ---- */

  // Render one template node against a scope; returns an array of DOM nodes
  // (0..n) to splice into the parent's child list.
  function renderNode(node, scope) {
    // text
    if (node.nodeType === 3) {
      var t = node.nodeValue;
      return t.indexOf('{{') === -1
        ? [document.createTextNode(t)]
        : [document.createTextNode(subst(t, scope))];

    var tag = node.tagName.toLowerCase();

    if (tag === 'sc-for') {
      var list = resolve(soleToken(node.getAttribute('list')) || '', scope) || [];
      var as = node.getAttribute('as');
      var out = [];

        var s = Object.create(scope);
        s[as] = list[i];
        s[as + '_index'] = i;
        var kids = renderChildren(node, s);
        for (var k = 0; k < kids.length; k++) out.push(kids[k]);
      }
      return out;
    }

    if (tag === 'dc-import') return [buildImport(node, scope)];

    // Inline SVG: no bindings live inside any SVG in this comp, so clone it
    // wholesale — that preserves the SVG namespace and its animations.
    if (tag === 'svg') return [node.cloneNode(true)];

    // ordinary element
    var el = node.cloneNode(false);
    var attrs = node.attributes;
    for (var j = 0; j < attrs.length; j++) {
      var an = attrs[j].name, av = attrs[j].value;
      if (SKIP_ATTR[an]) continue;
      if (HANDLERS[an]) {
        var tok = soleToken(av);
        var fn = tok && resolve(tok, scope);
        if (typeof fn === 'function') el.addEventListener(HANDLERS[an], fn);
        el.removeAttribute(an);
        continue;
      }
      if (an === 'value') {
        var vtok = soleToken(av);
        el.value = subst(av, scope);
        if (vtok) el.setAttribute('data-focus-key', vtok); // for focus restore
        el.removeAttribute('value');
        continue;
      }
      el.setAttribute(an, av.indexOf('{{') === -1 ? av : subst(av, scope));
    }
    var childOut = renderChildren(node, scope);
    for (var c = 0; c < childOut.length; c++) el.appendChild(childOut[c]);
    return [el];
  }

  function renderChildren(node, scope) {
    var out = [];
    var kids = node.childNodes;
    for (var i = 0; i < kids.length; i++) {
      var r = renderNode(kids[i], scope);
      for (var j = 0; j < r.length; j++) out.push(r[j]);
    }
    return out;
  }

  /* ---- focus preservation across full re-renders ---- */

  function captureFocus() {
    var a = document.activeElement;
    if (a && a.dataset && a.dataset.focusKey) {
      return { key: a.dataset.focusKey, start: a.selectionStart, end: a.selectionEnd };
    }
    return null;
  }
  function restoreFocus(f) {
    if (!f) return;
    var el = document.querySelector('[data-focus-key="' + f.key + '"]');
    if (!el) return;
    el.focus();
    try { if (f.start != null) el.setSelectionRange(f.start, f.end); } catch (e) {}
  }

  /* ---- mount ---- */

  var TPL = null;
  function renderApp(inst) {
    if (!TPL) TPL = document.getElementById('tpl').content.firstElementChild;
    var vals = inst.renderVals();
    var f = captureFocus();
    var root = renderNode(TPL, vals)[0];
    document.getElementById('app').replaceChildren(root);
    restoreFocus(f);
  }

  // Base class standing in for the Design runtime's DCLogic.
  window.DCLogic = class DCLogic {
    constructor(props) { this.props = props || {}; }
    setState(update) {
      var patch = typeof update === 'function' ? update(this.state) : update;
      this.state = Object.assign({}, this.state, patch);
      if (this._rerender) this._rerender();
    }
    forceUpdate() { if (this._rerender) this._rerender(); }
  };

  // Component (the comp's own logic) is defined immediately after this file
  // is concatenated; expose the mount entry point it will call.
  window.__mountBlindTrust = function (Component) {
    var inst = new Component({ liveData: true, defaultView: 'Tape', zebraStripes: true });
    inst._rerender = function () { renderApp(inst); };
    renderApp(inst);
    if (typeof inst.componentDidMount === 'function') inst.componentDidMount();
  };
})();

    }).catch(e => { console.warn('Blind Trust: live pipeline unavailable, using sample data.', e); this.setState({ dataSource:'sample' }); });
  }

  _slug(n){ return (n||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'x'; }
  _inits(n){ const p=(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').split(/\s+/).filter(Boolean); if(!p.length) return '?'; const a=p[0][0]||''; const b=p.length>1?p[p.length-1][0]:''; return (a+b).toUpperCase(); }
  _norm(s){ return (s||'').toLowerCase().replace(/\(spouse\)/g,'').replace(/[.,]/g,'').replace(/\b(inc|ltd|corp|corporation|company|limited|the|plc|co)\b/g,'').replace(/\s+/g,' ').trim(); }

  _tickerFor(s, tk){ if(tk) return tk; const n=this._norm(s); return this.NAME2TICKER[n] || (this.NAME2TICKER[n.replace(/ energy$| resources$/,'')]) || null; }
  _pct(v){ if(v==null) return null; if(typeof v==='number') return v; if(typeof v==='object'){ const c=[v.pct,v.change,v.changePct,v.since,v.perf,v.pctSince,v.change_pct].find(x=>typeof x==='number'); return c==null?null:c; } const f=parseFloat(v); return isNaN(f)?null:f; }
  _abbrev(s){ s=(s||'').replace(/\(spouse\)/i,'').trim(); return s.length>20?s.slice(0,19)+'…':s; }
  _roleType(r){ r=r||''; if(/parliamentary secretary/i.test(r)) return 'Parliamentary Secretaries'; if(/member of parliament/i.test(r)) return 'Members of Parliament'; if(/minister/i.test(r)) return 'Ministers and Ministers of State'; if(/(chief of staff|director|advisor|adviser|assistant|secretary|press|policy|operations|issues management|videographer|manager|comms)/i.test(r)) return 'Ministerial Staff'; if(/(clerk|ambassador|commissioner|president|chair|master of the mint|ombuds|comptroller|governor|ceo|vice-chair|member \()/i.test(r)) return 'Governor in Council Appointees'; return 'Public Office Holders'; }

        const key=this._slug(e.person); const oa=(e.otherAssets||[]).join(' ').toLowerCase();

  // alphanumerics — so registry names match the keys in photos.json.
  _pnorm(n){ return (n||'').normalize('NFKD').replace(/\p{Diacritic}/gu,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim(); }
  _photo(name){ return this.PHOTOS[this._pnorm(name)] || ''; }

  // % change for a tape ticker: live prices when available, else a sample map
  // derived from the baked holdings so the offline demo still shows numbers.
  _tapePct(tk){
    if(!tk) return null;
    const T=tk.toUpperCase();
    if(this.PRICES && Object.prototype.hasOwnProperty.call(this.PRICES,T)) return this.PRICES[T];
    if(!this._samplePx){ const m={}; Object.values(this.HOLDINGS||{}).forEach(a=>a.forEach(row=>{ const t=row[1],p=row[2]; if(t&&p!=null){ const k=t.toUpperCase(); if(!(k in m)) m[k]=p; } })); this._samplePx=m; }
    return (T in this._samplePx)?this._samplePx[T]:null;
  }

  // Squarified treemap: lay out items (each with a numeric `weight`) into a
  // W×H box so each tile's AREA is proportional to its weight. Returns the
  // items with {x,y,w,h} in the same units as W,H.
  _squarify(items, W, H){
    const total=items.reduce((s,i)=>s+i.weight,0)||1;
    const norm=(W*H)/total;
    const nodes=items.map(i=>({ ref:i, area:i.weight*norm }));
    const out=[]; const rect={x:0,y:0,w:W,h:H}; const N=nodes.length; let i=0;
    const worst=(row,len)=>{ const s=row.reduce((a,b)=>a+b.area,0); const mx=Math.max(...row.map(r=>r.area)), mn=Math.min(...row.map(r=>r.area)); return Math.max((len*len*mx)/(s*s),(s*s)/(len*len*mn)); };
    while(i<N){
      const len=Math.min(rect.w,rect.h);
      let row=[nodes[i]], j=i+1;
      while(j<N && worst(row.concat(nodes[j]),len)<=worst(row,len)){ row.push(nodes[j]); j++; }
      const sum=row.reduce((a,b)=>a+b.area,0), thick=sum/len; let off=0;
      if(rect.w>=rect.h){ row.forEach(r=>{ const seg=r.area/thick; out.push({ref:r.ref,x:rect.x,y:rect.y+off,w:thick,h:seg}); off+=seg; }); rect.x+=thick; rect.w-=thick; }
      else { row.forEach(r=>{ const seg=r.area/thick; out.push({ref:r.ref,x:rect.x+off,y:rect.y,w:seg,h:thick}); off+=seg; }); rect.y+=thick; rect.h-=thick; }
      i=j;
    }
    return out.map(r=>({ ...r.ref, x:r.x, y:r.y, w:r.w, h:r.h }));
  }
  statusColor(s){ return s==='No Longer Applicable' ? '#8C99A4' : '#B4D163'; }
  statusColorDark(s){ return s==='No Longer Applicable' ? '#59656F' : '#3a5a12'; }

  renderVals(){
    const st = this.state;
    const q = st.q.trim().toLowerCase();
    const P = this.PEOPLE;
    const zOn = this.props.zebraStripes !== false;
    const zebra = i => (zOn && i%2 ? 'rgba(253,255,252,.035)' : 'transparent');
    const zebraLt = i => (zOn && i%2 ? 'rgba(0,20,0,.035)' : 'transparent');
    const person = id => ({ id, name:P[id].name, initials:P[id].initials, ring:this.ring(id), roleLine:P[id].roleLine, photo:this._photo(P[id].name), open:()=>this.openProfile(id) });
    const sec = ([name,ticker,perf,sp], date) => { const pf=this.perf(perf); return { name, ticker:ticker||'', domain:this.dom(ticker), mono:this.mono(name,ticker), perfText:pf.t, perfColor:pf.c, perfDark:pf.d, sp:!!sp, date:date||'' }; };
    const chg = ([name,ticker]) => ({ name, ticker:ticker||'', domain:this.dom(ticker), mono:this.mono(name,ticker) });

    // ---- MOSAIC (proportional treemap; tile AREA ∝ number of disclosures) ----
    const tints = { add:'linear-gradient(155deg,rgba(180,209,99,.26),rgba(180,209,99,.07))', remove:'linear-gradient(155deg,rgba(140,153,164,.30),rgba(140,153,164,.10))', static:'linear-gradient(155deg,rgba(253,255,252,.14),rgba(253,255,252,.05))' };
    const RW = 688, treeH = 300;  // reference box: content column × fixed height
    const treeItems = this.MOSAIC.slice(0, 14)
      .map(([ticker,name,filers,events,tint]) => ({ ticker, name, filers, events, tint, weight: Math.max(1, events) }))
      .sort((a,b) => b.weight - a.weight);
    const mosaic = this._squarify(treeItems, RW, treeH).map(t => ({
      ticker:t.ticker, name:t.name, domain:this.dom(t.ticker), mono:this.mono(t.name,t.ticker), bg:tints[t.tint],
      x:+(t.x / RW * 100).toFixed(3), w:+(t.w / RW * 100).toFixed(3), y:Math.round(t.y), h:Math.round(t.h),
      showName: t.w >= 96 && t.h >= 64, showMeta: t.w >= 118 && t.h >= 92,
      meta:`${t.filers} filer${t.filers>1?'s':''} · ${t.events} disclosure${t.events>1?'s':''}` }));

    // ---- TAPE ----
    const evMap = { new:{label:'Newly disclosed',dot:'#B4D163'}, removed:{label:'No longer disclosed',dot:'#8C99A4'}, hold:{label:'Disclosed holding',dot:'rgba(253,255,252,.5)'} };
    let tape = this.TAPE.map(([tk,cname,pid,sp,ev,date]) => ({ company:{ ticker:tk, name:cname, domain:this.dom(tk), mono:this.mono(cname,tk) }, sp, personName:P[pid].name, personInitials:P[pid].initials, personRing:this.ring(pid), personPhoto:this._photo(P[pid].name), roleLine:P[pid].roleLine, perf:this.perf(this._tapePct(tk)), open:()=>this.openProfile(pid), event:{ ...evMap[ev], date }, _pid:pid, _blob:(tk+' '+cname+' '+P[pid].name).toLowerCase() }));
    if(st.pmOnly) tape = tape.filter(r=>P[r._pid]&&P[r._pid].isPM);
    if(q) tape = tape.filter(r=>r._blob.includes(q));
    const tapeTotal = tape.length;
    tape = tape.slice(0, st.tapeShown).map((r,i)=>({ ...r, zebra:zebra(i) }));

    // ---- HOLDINGS ----
    const bakedDD = id => id==='carney'?'2025-07-11':(id==='koutrakis'?'2026-07-08':id==='elkhoury'?'2026-07-06':(id==='costen'?'2026-07-04':''));
    const ddFor = id => (this.DDATE && this.DDATE[id]) || bakedDD(id);
    const bakedTags = { carney:['Compliance Measures (Act)','Declarable Assets'], koutrakis:['Disclosure Summary (Code)','Material Change'], elkhoury:['Disclosure Summary (Code)'], costen:['Summary Statement (Act)'] };
    const cardIds = (this.holdingsOrder && this.holdingsOrder.length) ? this.holdingsOrder : ['carney','koutrakis','elkhoury','costen'];
    let holdings = cardIds.filter(id=>P[id]).map(id => {
      const hold=(this.HOLDINGS[id]||[]).map(h=>sec(h, ddFor(id)));
      const mat=this.MATERIAL[id];
      const tags = (this.TAGS && this.TAGS[id]) ? this.TAGS[id] : (bakedTags[id]||[]);
      const sig=this.SIGCOUNT[id]||0;
      return { id, person:person(id), isPM:P[id].isPM, ring:P[id].isPM?0.5:0, ringW:P[id].isPM?2:0, signals:sig, hasSig:sig>0,
        pmNote: P[id].isPM ? 'Holdings in a blind trust — contents not publicly itemized. Screens and disclosed stock options are shown in the profile.' : '',
        hasSec: hold.length>0, securities: hold.map((s,i)=>({ ...s, zebra:zebra(i) })),
        hasMaterial: !!mat, material: mat?{ added:mat.added.map(a=>({ ...chg(a), date:mat.date })), removed:mat.removed.map(r=>({ ...chg(r), date:mat.date })), noneAdded:mat.added.length===0 }:{ added:[], removed:[], noneAdded:true },
        tags };
    });
    if(st.pmOnly) holdings = holdings.filter(c=>c.isPM);
    if(st.secOnly) holdings = holdings.filter(c=>c.hasSec);
    if(q) holdings = holdings.filter(c=>c.person.name.toLowerCase().includes(q));

    // ---- SIGNALS ----
    const signals = this.SIGNALS.map(s => ({ source:s.source, date:s.date, title:s.title, sector:s.sector, note:s.note||'',
      companies:s.companies.map(([n,t])=>({ ticker:t, name:n, domain:this.dom(t), mono:this.mono(n,t) })),
      holders:s.holders.map(([pid,tks,date,sp])=>({ name:P[pid].name, initials:P[pid].initials, ring:this.ring(pid), photo:this._photo(P[pid].name), open:()=>this.openProfile(pid), tickers:tks.join(', '), date, sp })) }));

    // ---- ALPHA ----
    const gfiMax=Math.max(...this.GFI.map(g=>g[1]));
    const gfi=this.GFI.map(([ticker,score,note])=>({ ticker, score, note, pct:Math.round(score/gfiMax*100) }));
    const sedi=this.SEDI.map(([date,ticker,role,action,amount],i)=>({ date, ticker, role, action, amount, color:action==='Buy'?'#B4D163':'#8C99A4', zebra:zebra(i) }));
    const lobMax=Math.max(...this.LOBBY.map(l=>l[2]));
    const lobby=this.LOBBY.map(([name,domain,count,note])=>({ name, domain, mono:this.mono(name,''), count, note, pct:Math.round(count/lobMax*100) }));
    const contracts=this.CONTRACTS.map(([date,co,domain,dept,desc,amt],i)=>({ date, co, domain, mono:this.mono(co,''), dept, desc, amt, zebra:zebra(i) }));

    // ---- FILINGS (filtered) ----
    let filings = this.FILINGS.slice();
    if(st.pmOnly) filings=filings.filter(f=>P[f.pid]&&P[f.pid].isPM);
    if(st.secOnly) filings=filings.filter(f=>f.securities);
    if(st.role!=='All') filings=filings.filter(f=>P[f.pid]&&P[f.pid].roleType===st.role);
    if(st.status!=='All') filings=filings.filter(f=>f.status===st.status);
    if(st.declType!=='All') filings=filings.filter(f=>f.type===st.declType);
    if(st.otherDoc!=='All') filings=filings.filter(f=>f.type===st.otherDoc);
    if(st.dateFrom) filings=filings.filter(f=>f.date>=st.dateFrom);
    if(st.dateTo) filings=filings.filter(f=>f.date<=st.dateTo);
    if(q) filings=filings.filter(f=>(P[f.pid].name+' '+f.title+' '+JSON.stringify(f.lines||[])+JSON.stringify(f.added||[])+JSON.stringify(f.removed||[])).toLowerCase().includes(q));
    const dir=st.order==='asc'?1:-1;
    const last=id=>P[id].name.trim().split(' ').slice(-1)[0];
    const first=id=>P[id].name.trim().split(' ')[0];
    filings.sort((a,b)=>{ if(st.sortBy==='Disclosure date'){ return dir*(a.date<b.date?-1:a.date>b.date?1:0); } const va=st.sortBy==='Last name'?last(a.pid):first(a.pid), vb=st.sortBy==='Last name'?last(b.pid):first(b.pid); return dir*va.localeCompare(vb); });
    const filingCards = filings.map(f => {
      const chips=[];
      if(P[f.pid]&&P[f.pid].isPM) chips.push({label:'PM',bg:'#B4D163',fg:'#001400'});
      if(f.securities) chips.push({label:'Securities',bg:'rgba(180,209,99,.9)',fg:'#001400'});
      if(f.isNew) chips.push({label:'New',bg:'#B4D163',fg:'#001400'});
      if(f.noLonger) chips.push({label:'No longer applicable',bg:'rgba(89,101,111,.85)',fg:'#FDFFFC'});
      const tags=[]; if(f.regime!=='—') tags.push(f.regime); tags.push(f.type); if(P[f.pid]) tags.push(P[f.pid].roleType);
      const added=(f.added||[]).map(chg), removed=(f.removed||[]).map(chg);
      return { id:f.id, title:f.title, date:f.date, status:f.status, statusColor:this.statusColor(f.status), person:person(f.pid),
        chips, hasChips:chips.length>0, lines:(f.lines||[]).map(([label,value])=>({label,value})), hasLines:(f.lines||[]).length>0,
        added, removed, hasAdded:added.length>0, hasRemoved:removed.length>0, hasChanges:(added.length+removed.length)>0, tags };
    });

    // ---- FILTERS ----
    const mk=(field,arr)=>arr.map(v=>{ const a=st[field]===v; return { label:v, onClick:()=>this.setState({[field]:v}), bg:a?'#B4D163':'rgba(0,20,0,.06)', fg:'#001400' }; });
    const orderOpts=[{label:'Newest first',v:'desc'},{label:'Oldest first',v:'asc'}].map(o=>{ const a=st.order===o.v; return { label:o.label, onClick:()=>this.setState({order:o.v}), bg:a?'#B4D163':'rgba(0,20,0,.06)', fg:'#001400' }; });
    const groups=[ {title:'Declaration type',opts:mk('declType',this.DECL)}, {title:'Other documents',opts:mk('otherDoc',this.OTHERDOCS)}, {title:'Role',opts:mk('role',this.ROLES)}, {title:'Status',opts:mk('status',this.STATUSES)}, {title:'Sort by',opts:mk('sortBy',this.SORTS)}, {title:'Order',opts:orderOpts} ];
    const legend=[['Liberal','#D71920'],['Conservative','#1A4782'],['NDP','#F58220'],['Bloc','#33B2CC'],['Green','#3D9B35'],['Non-affiliated','#8C99A4']].map(([label,color])=>({label,color}));
    let activeCount=0; ['declType','otherDoc','role','status'].forEach(k=>{ if(st[k]!=='All') activeCount++; }); if(st.dateFrom) activeCount++; if(st.dateTo) activeCount++;

    // ---- NOTIFICATIONS ----
    const notifs=this.FILINGS.slice().sort((a,b)=>a.date<b.date?1:-1).slice(0,8).map((f,i)=>({ name:P[f.pid].name, type:f.title, date:f.date, dot:f.securities?'#B4D163':'rgba(0,20,0,.2)', open:()=>this.openProfile(f.pid), zebra:zebraLt(i) }));
    const notifCount=st.notifRead?0:notifs.length;

    // ---- PROFILE ----
    let prof=null;
    if(st.profileId){ const id=st.profileId; const p=P[id]; const fs=this.FILINGS.filter(f=>f.pid===id); const hold=(this.HOLDINGS[id]||[]); const mat=this.MATERIAL[id]; const dd=(this.DDATE&&this.DDATE[id])||(id==='carney'?'2025-07-11':(id==='koutrakis'?'2026-07-08':id==='elkhoury'?'2026-07-06':''));
      prof={ name:p.name, initials:p.initials, ring:this.ring(id), photo:this._photo(p.name), title:p.title, bio:p.bio,
        stats:[['Filings',fs.length],['Securities',hold.length],['Added',mat?mat.added.length:0],['Removed',mat?mat.removed.length:0],['Signals',this.SIGCOUNT[id]||0]].map(([k,v])=>({k,v})),
        hasSec:hold.length>0, securities:hold.map(h=>sec(h,dd)),
        hasMaterial:!!mat, material: mat?{ added:mat.added.map(chg), removed:mat.removed.map(chg), noneAdded:mat.added.length===0 }:{added:[],removed:[],noneAdded:true},
        hasOther:(this.OTHER[id]||[]).length>0, other:this.OTHER[id]||[],
        filings:fs.map(f=>({ type:f.title, date:f.date, status:f.status, color:this.statusColorDark(f.status) })) };
    }

    const nk=k=>({ go:()=>this.setView(k), bg: st.view===k?'#001400':'transparent', fg: st.view===k?'#FDFFFC':'rgba(0,20,0,.6)' });

    return {
      // view flags
      isTape:st.view==='tape', isHoldings:st.view==='holdings', isSignals:st.view==='signals', isAlpha:st.view==='alpha', isFilings:st.view==='filings',
      nav:{ tape:nk('tape'), holdings:nk('holdings'), signals:nk('signals'), alpha:nk('alpha'), filings:nk('filings') },
      // search + chrome
      q:st.q, onSearch:this.onSearch, toggleFilters:this.toggleFilters, closeFilters:this.closeFilters,
      activeCount, hasActive:activeCount>0,
      toggleNotif:this.toggleNotif, closeNotif:this.closeNotif, markAll:this.markAll, notifs, notifCount, hasNotif:notifCount>0,
      showFilters:st.showFilters, showNotif:st.showNotif,
      pmChip:{ onClick:()=>this.setState(s=>({pmOnly:!s.pmOnly, tapeShown:20})), bg:st.pmOnly?'#B4D163':'rgba(0,20,0,.4)', fg:st.pmOnly?'#001400':'#FDFFFC' },
      secChip:{ onClick:()=>this.setState(s=>({secOnly:!s.secOnly})), bg:st.secOnly?'#B4D163':'rgba(0,20,0,.4)', fg:st.secOnly?'#001400':'#FDFFFC' },
      showClear: activeCount>0 || st.pmOnly || st.secOnly || !!q, clearFilters:this.clearFilters,
      dateNote: st.dataSource==='live' ? ((this.liveDate||'live')+' · live CIEC pipeline') : (st.dataSource==='loading' ? 'syncing live pipeline…' : '2026-07-13 · sample data'),
      // data
      mosaic, treeH, tape, tapeHasMore: tapeTotal > st.tapeShown, tapeMoreCount: Math.min(20, Math.max(0, tapeTotal - st.tapeShown)), loadMoreTape:this.loadMoreTape,
      holdings, holdingsEmpty:holdings.length===0, signals, gfi, sedi, lobby, contracts,
      filings:filingCards, filingsEmpty:filingCards.length===0,
      groups, legend, dateFrom:st.dateFrom, dateTo:st.dateTo, onDateFrom:this.onDateFrom, onDateTo:this.onDateTo,
      // profile
      hasProfile:!!prof, prof:prof||{stats:[],securities:[],material:{added:[],removed:[]},other:[],filings:[]}, closeProfile:this.closeProfile, stop:this.stop,
      // copy
      signalsIntro:'Federal press releases, fund investments and project designations naming a publicly traded company — cross-matched against disclosed holdings.',
      alphaIntro:'Canada has no STOCK Act — the registry gives holdings snapshots, never trades or amounts. These are the federal datasets that do publish tradeable detail.',
      footTape:"Since* = the stock's market move from the disclosure date (green up / amber down) — not a purchase price; the registry reports neither trade dates nor amounts. Events are disclosure states, not confirmed buys/sells. 'No longer disclosed' can mean sale, transfer to trust, exemption, or falling below the threshold.",
      footNoLonger:"'No longer disclosed' can mean a sale, transfer to a blind trust, exemption, or the holding falling below the reporting threshold — not necessarily a sale.",
      footProfile:"'Since' measures the security from the disclosure date, not the filer's purchase date — the registry reports neither trade dates nor amounts. sp = spouse's asset.",
      footer:'Sources: CIEC Public Registry · SEDI · Registry of Lobbyists · CanadaBuys · Canada.ca newsroom. Independent tool — not a Government of Canada site. Public data; not investment advice.',
    };
  }
}

window.__mountBlindTrust(Component);
</script>
