name: blind-trust-pipeline

on:
  schedule:
    - cron: "17 */6 * * *"   # registry check every 6 hours
    - cron: "43 7 * * *"     # altdata + prices nightly (07:43 UTC)
  workflow_dispatch:
    inputs:
      task:
        description: "registry | altdata | prices | all"
        default: "all"

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Decide task
        id: task
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "task=${{ github.event.inputs.task }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "43 7 * * *" ]; then
            echo "task=all" >> "$GITHUB_OUTPUT"
          else
            echo "task=registry" >> "$GITHUB_OUTPUT"
          fi

      - name: Run pipeline
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: python -m pipeline.run ${{ steps.task.outputs.task }}

      - name: Commit data
        run: |
          git config user.name "blind-trust-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: automated update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push
          fi
